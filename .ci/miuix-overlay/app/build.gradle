plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.arashi'
    compileSdk 36
    defaultConfig {
        applicationId 'com.arashi'
        minSdk 31
        targetSdk 34
        versionCode 11
        versionName '0.2.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        compose true
    }
}
dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'org.jetbrains.compose.ui:ui:1.10.1'
    implementation 'org.jetbrains.compose.foundation:foundation:1.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'top.yukonga.miuix.kmp:miuix:0.8.5'
}
